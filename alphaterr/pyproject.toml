[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaterr"
version = "0.1.0"
description = "Hybrid search and reward-only learning lab for Territorial.io-style offline simulators"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
train = ["torch>=2.2"]
vision = ["opencv-python>=4.8", "pillow>=10.0", "pytesseract>=0.3.10", "mss>=9"]
test = ["pytest>=7.4"]

[project.scripts]
alphaterr-train = "alphaterr.train:main"
alphaterr-demo = "alphaterr.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alphaterr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
