name: AlphaTerr offline Python tests
on:
  push:
    branches: [feature/alphaterr-hybrid-v0]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  offline-unit:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e './alphaterr[test]'
      - run: python -m pytest alphaterr/tests -q
      - run: python -m alphaterr.demo --seed 7 --ticks 10
